<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電路實驗室：LED 與二極體電路教學</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --board-bg: #142a1f;
      --board-wood: #4a2711;
      --chalk-white: #f5f8f6;
      --chalk-yellow: #fff566;
      --chalk-green: #52ff90;
      --chalk-blue: #38d8ff;
      --chalk-red: #ff4d6d;
      --chalk-sub: #cfd8dc;
      --wire-color: rgba(245, 248, 246, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0a130e;
      font-family: 'Noto Sans TC', sans-serif;
      color: var(--chalk-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .blackboard-frame {
      width: 100%;
      max-width: 1320px;
      background: var(--board-wood);
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85), inset 0 0 12px rgba(0,0,0,0.7);
    }

    .blackboard {
      background-color: var(--board-bg);
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(255,255,255,0.04) 0%, transparent 80%),
        radial-gradient(circle at 10% 20%, rgba(0,0,0,0.3) 0%, transparent 60%),
        radial-gradient(circle at 90% 80%, rgba(0,0,0,0.3) 0%, transparent 60%);
      border: 2px solid #1c382a;
      border-radius: 4px;
      padding: 18px 16px 14px 16px;
      position: relative;
      box-shadow: inset 0 0 80px rgba(0,0,0,0.75);
    }

    .board-header {
      text-align: center;
      margin-bottom: 12px;
    }

    .main-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--chalk-white);
      text-shadow: 0 0 4px rgba(255,255,255,0.4), 2px 2px 4px rgba(0,0,0,0.8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      white-space: nowrap;
    }

    .sparkle {
      color: #ffffff;
      font-size: 1.2rem;
      filter: drop-shadow(0 0 3px #ffffff);
    }

    .chalk-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto auto;
      position: relative;
    }

    .chalk-grid::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 33.333%;
      width: 0;
      border-left: 1.5px dashed rgba(255,255,255,0.3);
      pointer-events: none;
    }
    .chalk-grid::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 66.666%;
      width: 0;
      border-left: 1.5px dashed rgba(255,255,255,0.3);
      pointer-events: none;
    }
    .grid-h-line {
      grid-column: 1 / -1;
      height: 0;
      border-top: 1.5px dashed rgba(255,255,255,0.3);
      margin: 8px 0 10px 0;
      pointer-events: none;
    }

    .cell-q1 { grid-column: 3; grid-row: 1; }
    .cell-q2 { grid-column: 3; grid-row: 3; }
    .cell-q3 { grid-column: 2; grid-row: 1; }
    .cell-q4 { grid-column: 2; grid-row: 3; }
    .cell-q5 { grid-column: 1; grid-row: 1; }
    .cell-q6 { grid-column: 1; grid-row: 3; }

    @media (max-width: 900px) {
      .blackboard { padding: 14px 10px; }
      .main-title { font-size: 1.15rem; gap: 6px; }
      .chalk-grid { grid-template-columns: 1fr; }
      .chalk-grid::before, .chalk-grid::after, .grid-h-line { display: none; }
      .cell-q1 { grid-column: 1; grid-row: 1; border-bottom: 1.5px dashed rgba(255,255,255,0.25); padding-bottom: 14px; }
      .cell-q2 { grid-column: 1; grid-row: 2; border-bottom: 1.5px dashed rgba(255,255,255,0.25); padding-bottom: 14px; }
      .cell-q3 { grid-column: 1; grid-row: 3; border-bottom: 1.5px dashed rgba(255,255,255,0.25); padding-bottom: 14px; }
      .cell-q4 { grid-column: 1; grid-row: 4; border-bottom: 1.5px dashed rgba(255,255,255,0.25); padding-bottom: 14px; }
      .cell-q5 { grid-column: 1; grid-row: 5; border-bottom: 1.5px dashed rgba(255,255,255,0.25); padding-bottom: 14px; }
      .cell-q6 { grid-column: 1; grid-row: 6; }
    }

    .q-box {
      padding: 6px 12px 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .q-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--chalk-white);
      margin-bottom: 4px;
      white-space: nowrap;
      text-align: center;
    }

    .svg-container {
      width: 100%;
      height: 155px;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .wire {
      stroke: var(--wire-color);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 0 1px rgba(255,255,255,0.35));
    }

    .chalk-txt {
      font-family: 'Noto Sans TC', sans-serif;
      fill: var(--chalk-white);
      font-size: 12px;
      white-space: nowrap;
    }
    .chalk-txt-sub { fill: var(--chalk-sub); }
    .chalk-pin {
      font-size: 11px;
      fill: #b0bec5;
    }

    /* 極性點擊按鈕：改為純白光反饋，不混淆黃色 LED */
    .pol-btn-group {
      cursor: pointer;
    }
    .pol-circle {
      fill: #193427;
      stroke: var(--chalk-white);
      stroke-width: 2;
      transition: all 0.2s ease;
    }
    .pol-btn-group:hover .pol-circle {
      stroke: #ffffff;
      filter: drop-shadow(0 0 6px #ffffff);
    }
    .pol-text {
      font-size: 15px;
      font-weight: 700;
      fill: var(--chalk-white);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 二極體實體與高質感發光 */
    .led-core {
      stroke-width: 2.2;
      stroke: #ffffff;
      transition: all 0.25s ease;
    }

    .glow-red {
      fill: #ff2a51 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #ff1744) drop-shadow(0 0 16px rgba(255, 23, 68, 0.95)) drop-shadow(0 0 30px rgba(255, 82, 82, 0.6)) !important;
    }
    .glow-blue {
      fill: #00e5ff !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #00e5ff) drop-shadow(0 0 16px rgba(0, 229, 255, 0.95)) drop-shadow(0 0 30px rgba(64, 196, 255, 0.6)) !important;
    }
    .glow-yellow {
      fill: #ffea00 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #ffd600) drop-shadow(0 0 16px rgba(255, 234, 0, 0.95)) drop-shadow(0 0 30px rgba(255, 255, 0, 0.6)) !important;
    }
    .glow-green {
      fill: #00ff73 !important;
      stroke: #ffffff !important;
      filter: drop-shadow(0 0 6px #00e676) drop-shadow(0 0 16px rgba(0, 230, 118, 0.95)) drop-shadow(0 0 30px rgba(105, 240, 174, 0.6)) !important;
    }

    .led-off {
      fill: #223a2e !important;
      stroke: rgba(255,255,255,0.35) !important;
      filter: none !important;
    }

    /* 電壓滑桿 */
    .slider-wrap {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .volt-num {
      font-family: 'Caveat', cursive, sans-serif;
      font-size: 1.18rem;
      color: var(--chalk-white);
      letter-spacing: 0.5px;
      height: 22px;
    }

    .slider-inner {
      width: 82%;
      display: flex;
      align-items: center;
    }

    .range-chalk {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      border: 1px dashed rgba(255,255,255,0.55);
      outline: none;
      margin: 4px 0;
    }
    .range-chalk::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #5c341b;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
    }

    .range-minmax {
      display: flex;
      width: 82%;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--chalk-sub);
    }

    .bottom-note {
      text-align: center;
      font-size: 0.85rem;
      color: var(--chalk-white);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<div class="blackboard-frame">
  <div class="blackboard">

    <!-- 頂部標題 -->
    <div class="board-header">
      <h1 class="main-title">
        <span class="sparkle">✦</span>
        電路實驗室：LED 與二極體電路教學
        <span class="sparkle">✦</span>
      </h1>
    </div>

    <!-- 六題網格 -->
    <div class="chalk-grid">

      <!-- ==================== 第 1 題（右上角）：並聯紅藍 LED ==================== -->
      <div class="q-box cell-q1">
        <div class="q-title">【第1題】並聯紅藍 LED</div>
        <div class="svg-container">
          <svg viewBox="0 0 340 180" id="svg1">
            <text x="50" y="32" class="chalk-txt chalk-txt-sub" text-anchor="middle">點擊切換極性</text>
            <text x="50" y="46" class="chalk-txt chalk-txt-sub" text-anchor="middle">↔</text>

            <!-- 並聯導線 -->
            <path d="M 50 90 L 110 90 L 145 45 L 195 45 L 230 90 L 290 90" class="wire" />
            <path d="M 110 90 L 145 135 L 195 135 L 230 90" class="wire" />

            <!-- 紅 LED (上：左長右短，朝右導通) -->
            <polygon points="175,45 155,34 155,56" class="led-core" id="led-1-red" fill="#ff4d6d" />
            <line x1="175" y1="34" x2="175" y2="56" stroke="#fff" stroke-width="2.2" />
            <text x="165" y="24" class="chalk-txt" fill="#ff6b8b" font-weight="bold">紅</text>
            <text x="142" y="38" class="chalk-pin">長</text>
            <text x="185" y="38" class="chalk-pin">短</text>

            <!-- 藍 LED (下：左長右短，朝右導通) -->
            <polygon points="175,135 155,124 155,146" class="led-core" id="led-1-blue" fill="#38d8ff" />
            <line x1="175" y1="124" x2="175" y2="146" stroke="#fff" stroke-width="2.2" />
            <text x="165" y="162" class="chalk-txt" fill="#38d8ff" font-weight="bold">藍</text>
            <text x="142" y="148" class="chalk-pin">長</text>
            <text x="185" y="148" class="chalk-pin">短</text>

            <!-- 極性按鈕 (白光反饋) -->
            <g class="pol-btn-group" onclick="togglePolarity(1)">
              <circle cx="50" cy="90" r="16" class="pol-circle" />
              <text x="50" y="90" class="pol-text" id="pol-1-left">＋</text>
            </g>
            <g class="pol-btn-group" onclick="togglePolarity(1)">
              <circle cx="290" cy="90" r="16" class="pol-circle" />
              <text x="290" y="90" class="pol-text" id="pol-1-right">－</text>
            </g>
          </svg>
        </div>
        <div class="slider-wrap">
          <div class="volt-num" id="val-1">6.0V</div>
          <div class="slider-inner">
            <input type="range" min="0" max="10" step="0.1" value="6.0" class="range-chalk" id="range-1" oninput="handleVolt(1)">
          </div>
          <div class="range-minmax"><span>0.0V</span><span>10.0V</span></div>
        </div>
        <div class="bottom-note" id="note-1">僅紅燈亮（紅燈箝位使藍燈不亮）</div>
      </div>

      <!-- ==================== 第 3 題（中上方）：並聯黃綠 LED ==================== -->
      <div class="q-box cell-q3">
        <div class="q-title">【第3題】並聯黃綠 LED</div>
        <div class="svg-container">
          <svg viewBox="0 0 340 180" id="svg3">
            <text x="50" y="32" class="chalk-txt chalk-txt-sub" text-anchor="middle">點擊切換極性</text>
            <text x="50" y="46" class="chalk-txt chalk-txt-sub" text-anchor="middle">↔</text>

            <path d="M 50 90 L 110 90 L 145 45 L 195 45 L 230 90 L 290 90" class="wire" />
            <path d="M 110 90 L 145 135 L 195 135 L 230 90" class="wire" />

            <!-- 黃 LED (上：左長右短) -->
            <polygon points="175,45 155,34 155,56" class="led-core" id="led-3-yellow" fill="#fff566" />
            <line x1="175" y1="34" x2="175" y2="56" stroke="#fff" stroke-width="2.2" />
            <text x="165" y="24" class="chalk-txt" fill="#fff566" font-weight="bold">黃</text>
            <text x="142" y="38" class="chalk-pin">長</text>
            <text x="185" y="38" class="chalk-pin">短</text>

            <!-- 綠 LED (下：左長右短) -->
            <polygon points="175,135 155,124 155,146" class="led-core" id="led-3-green" fill="#52ff90" />
            <line x1="175" y1="124" x2="175" y2="146" stroke="#fff" stroke-width="2.2" />
            <text x="165" y="162" class="chalk-txt" fill="#52ff90" font-weight="bold">綠</text>
            <text x="142" y="148" class="chalk-pin">長</text>
            <text x="185" y="148" class="chalk-pin">短</text>

            <!-- 極性按鈕 -->
            <g class="pol-btn-group" onclick="togglePolarity(3)">
              <circle cx="50" cy="90" r="16" class="pol-circle" />
              <text x="50" y="90" class="pol-text" id="pol-3-left">＋</text>
            </g>
            <g class="pol-btn-group" onclick="togglePolarity(3)">
              <circle cx="290" cy="90" r="16" class="pol-circle" />
              <text x="290" y="90" class="pol-text" id="pol-3-right">－</text>
            </g>
          </svg>
        </div>
        <div class="slider-wrap">
          <div class="volt-num" id="val-3">6.0V</div>
          <div class="slider-inner">
            <input type="range" min="0" max="10" step="0.1" value="6.0" class="range-chalk" id="range-3" oninput="handleVolt(3)">
          </div>
          <div class="range-minmax"><span>0.0V</span><span>10.0V</span></div>
        </div>
        <div class="bottom-note" id="note-3">跨到電壓（黃綠皆亮）</div>
      </div>

      <!-- ==================== 第 5 題（左上角）：反向並聯 LED ==================== -->
      <div class="q-box cell-q5">
        <div class="q-title">【第5題】反向並聯 LED</div>
        <div class="svg-container">
          <svg viewBox="0 0 340 180" id="svg5">
            <text x="50" y="32" class="chalk-txt chalk-txt-sub" text-anchor="middle">點擊切換極性</text>
            <text x="50" y="46" class="chalk-txt chalk-txt-sub" text-anchor="middle">↔</text>

            <path d="M 50 90 L 105 90 L 140 50 L 205 50 L 240 90 L 290 90" class="wire" />
            <path d="M 105 90 L 140 130 L 205 130 L 240 90" class="wire" />

            <!-- A 燈 (上：右長左短，右+時導通) -->
            <polygon points="160,50 180,40 180,60" class="led-core" id="led-5-a" fill="#ff4d6d" />
            <line x1="160" y1="40" x2="160" y2="60" stroke="#fff" stroke-width="2.2" />
            <text x="142" y="38" class="chalk-pin">短</text>
            <text x="195" y="38" class="chalk-pin">長</text>
            <text x="170" y="30" class="chalk-txt" fill="#ff6b8b" font-weight="bold">A</text>

            <!-- B 燈 (下：左長右短，左+時導通) -->
            <polygon points="180,130 160,120 160,140" class="led-core" id="led-5-b" fill="#52ff90" />
            <line x1="180" y1="120" x2="180" y2="140" stroke="#fff" stroke-width="2.2" />
            <text x="142" y="146" class="chalk-pin">長</text>
            <text x="195" y="146" class="chalk-pin">短</text>
            <text x="170" y="156" class="chalk-txt" fill="#52ff90" font-weight="bold">B</text>

            <!-- 極性按鈕 -->
            <g class="pol-btn-group" onclick="togglePolarity(5)">
              <circle cx="50" cy="90" r="16" class="pol-circle" />
              <text x="50" y="90" class="pol-text" id="pol-5-left">－</text>
            </g>
            <g class="pol-btn-group" onclick="togglePolarity(5)">
              <circle cx="290" cy="90" r="16" class="pol-circle" />
              <text x="290" y="90" class="pol-text" id="pol-5-right">＋</text>
            </g>
          </svg>
        </div>
        <div class="slider-wrap">
          <div class="volt-num" id="val-5">6.0V</div>
          <div class="slider-inner">
            <input type="range" min="0" max="10" step="0.1" value="6.0" class="range-chalk" id="range-5" oninput="handleVolt(5)">
          </div>
          <div class="range-minmax"><span>0.0V</span><span>10.0V</span></div>
        </div>
        <div class="bottom-note" id="note-5">A 燈亮、B 燈熄滅（極性輪流導通）</div>
      </div>

      <!-- 分隔線 -->
      <div class="grid-h-line"></div>

      <!-- ==================== 第 2 題（右下角）：串聯紅藍 LED ==================== -->
      <div class="q-box cell-q2">
        <div class="q-title">【第2題】串聯紅藍 LED</div>
        <div class="svg-container">
          <svg viewBox="0 0 340 180" id="svg2">
            <text x="50" y="32" class="chalk-txt chalk-txt-sub" text-anchor="middle">點擊切換極性</text>
            <text x="50" y="46" class="chalk-txt chalk-txt-sub" text-anchor="middle">↔</text>

            <path d="M 50 90 L 110 90 L 130 90 L 175 90 L 200 90 L 245 90 L 290 90" class="wire" />

            <!-- 藍燈 (左：左長右短，朝右導通) -->
            <polygon points="150,90 130,80 130,100" class="led-core" id="led-2-blue" fill="#38d8ff" />
            <line x1="150" y1="80" x2="150" y2="100" stroke="#fff" stroke-width="2.2" />
            <text x="140" y="68" class="chalk-txt" fill="#38d8ff" font-weight="bold">藍</text>
            <text x="115" y="85" class="chalk-pin">長</text>
            <text x="160" y="85" class="chalk-pin">短</text>

            <!-- 紅燈 (右：左長右短，朝右導通) -->
            <polygon points="225,90 205,80 205,100" class="led-core" id="led-2-red" fill="#ff4d6d" />
            <line x1="225" y1="80" x2="225" y2="100" stroke="#fff" stroke-width="2.2" />
            <text x="215" y="68" class="chalk-txt" fill="#ff6b8b" font-weight="bold">紅</text>
            <text x="190" y="85" class="chalk-pin">長</text>
            <text x="235" y="85" class="chalk-pin">短</text>

            <!-- 極性按鈕 -->
            <g class="pol-btn-group" onclick="togglePolarity(2)">
              <circle cx="50" cy="90" r="16" class="pol-circle" />
              <text x="50" y="90" class="pol-text" id="pol-2-left">＋</text>
            </g>
            <g class="pol-btn-group" onclick="togglePolarity(2)">
              <circle cx="290" cy="90" r="16" class="pol-circle" />
              <text x="290" y="90" class="pol-text" id="pol-2-right">－</text>
            </g>
          </svg>
        </div>
        <div class="slider-wrap">
          <div class="volt-num" id="val-2">6.0V</div>
          <div class="slider-inner">
            <input type="range" min="0" max="10" step="0.1" value="6.0" class="range-chalk" id="range-2" oninput="handleVolt(2)">
          </div>
          <div class="range-minmax"><span>0.0V</span><span>10.0V</span></div>
        </div>
        <div class="bottom-note" id="note-2">藍、紅皆亮（若電壓夠高）</div>
      </div>

      <!-- ==================== 第 4 題（中下方）：串聯黃綠 LED ==================== -->
      <div class="q-box cell-q4">
        <div class="q-title">【第4題】串聯黃綠 LED</div>
        <div class="svg-container">
          <svg viewBox="0 0 340 180" id="svg4">
            <text x="50" y="32" class="chalk-txt chalk-txt-sub" text-anchor="middle">點擊切換極性</text>
            <text x="50" y="46" class="chalk-txt chalk-txt-sub" text-anchor="middle">↔</text>

            <path d="M 50 90 L 110 90 L 130 90 L 175 90 L 200 90 L 245 90 L 290 90" class="wire" />

            <!-- 綠燈 (左：左長右短) -->
            <polygon points="150,90 130,80 130,100" class="led-core" id="led-4-green" fill="#52ff90" />
            <line x1="150" y1="80" x2="150" y2="100" stroke="#fff" stroke-width="2.2" />
            <text x="140" y="68" class="chalk-txt" fill="#52ff90" font-weight="bold">綠</text>
            <text x="115" y="85" class="chalk-pin">長</text>
            <text x="160" y="85" class="chalk-pin">短</text>

            <!-- 黃燈 (右：左長右短) -->
            <polygon points="225,90 205,80 205,100" class="led-core" id="led-4-yellow" fill="#fff566" />
            <line x1="225" y1="80" x2="225" y2="100" stroke="#fff" stroke-width="2.2" />
            <text x="215" y="68" class="chalk-txt" fill="#fff566" font-weight="bold">黃</text>
            <text x="190" y="85" class="chalk-pin">長</text>
            <text x="235" y="85" class="chalk-pin">短</text>

            <!-- 極性按鈕 -->
            <g class="pol-btn-group" onclick="togglePolarity(4)">
              <circle cx="50" cy="90" r="16" class="pol-circle" />
              <text x="50" y="90" class="pol-text" id="pol-4-left">＋</text>
            </g>
            <g class="pol-btn-group" onclick="togglePolarity(4)">
              <circle cx="290" cy="90" r="16" class="pol-circle" />
              <text x="290" y="90" class="pol-text" id="pol-4-right">－</text>
            </g>
          </svg>
        </div>
        <div class="slider-wrap">
          <div class="volt-num" id="val-4">6.0V</div>
          <div class="slider-inner">
            <input type="range" min="0" max="10" step="0.1" value="6.0" class="range-chalk" id="range-4" oninput="handleVolt(4)">
          </div>
          <div class="range-minmax"><span>0.0V</span><span>10.0V</span></div>
        </div>
        <div class="bottom-note" id="note-4">當電壓足夠時（黃綠兩燈皆亮）</div>
      </div>

      <!-- ==================== 第 6 題（左下角）：橋式整流 ==================== -->
      <div class="q-box cell-q6">
        <div class="q-title">【第6題】橋式整流</div>
        <div class="svg-container">
          <svg viewBox="0 0 340 180" id="svg6">
            <text x="50" y="32" class="chalk-txt chalk-txt-sub" text-anchor="middle">點擊切換極性</text>
            <text x="50" y="46" class="chalk-txt chalk-txt-sub" text-anchor="middle">↔</text>

            <path d="M 50 90 L 95 90" class="wire" />
            <path d="M 125 50 L 165 90 L 125 130 L 85 90 Z" class="wire" />

            <!-- 4顆整流二極體 -->
            <polygon points="100,75 110,65 110,85" fill="#fff" />
            <polygon points="140,65 150,75 140,85" fill="#fff" />
            <polygon points="110,95 100,105 110,115" fill="#fff" />
            <polygon points="140,95 150,105 140,115" fill="#fff" />

            <!-- 輸出路徑 -->
            <path d="M 165 90 L 210 90" class="wire" />
            <path d="M 235 90 L 265 90 L 265 145 L 85 145 L 85 90" class="wire" />

            <!-- 負載 LED (朝右導通) -->
            <polygon points="230,90 215,80 215,100" class="led-core" id="led-6-load" fill="#52ff90" />
            <line x1="230" y1="80" x2="230" y2="100" stroke="#fff" stroke-width="2.2" />
            
            <text x="238" y="72" class="chalk-txt" fill="#52ff90" font-size="15" font-weight="bold">✔</text>
            <text x="250" y="74" class="chalk-txt chalk-txt-sub" font-size="11">負載LED</text>
            <text x="245" y="98" class="chalk-txt chalk-txt-yellow" font-size="11" font-weight="bold">恆亮</text>

            <!-- 極性按鈕 -->
            <g class="pol-btn-group" onclick="togglePolarity(6)">
              <circle cx="50" cy="90" r="16" class="pol-circle" />
              <text x="50" y="90" class="pol-text" id="pol-6-left">＋</text>
            </g>
          </svg>
        </div>
        <div class="slider-wrap">
          <div class="volt-num" id="val-6">6.0V</div>
          <div class="slider-inner">
            <input type="range" min="0" max="10" step="0.1" value="6.0" class="range-chalk" id="range-6" oninput="handleVolt(6)">
          </div>
          <div class="range-minmax"><span>0.0V</span><span>10.0V</span></div>
        </div>
        <div class="bottom-note" id="note-6">無論改變極性，負載燈均恆亮！</div>
      </div>

    </div>
  </div>
</div>

<script>
  // 記錄 6 題極性狀態 (true: 左+ 右-, false: 左- 右+)
  const polarities = {
    1: true,  // 左+ 右- (順向點亮)
    2: true,  // 左+ 右- (順向點亮)
    3: true,  // 左+ 右- (順向點亮)
    4: true,  // 左+ 右- (順向點亮)
    5: false, // 預設左- 右+ (A燈長腳接+順向亮)
    6: true   // 正向輸入
  };

  function togglePolarity(q) {
    polarities[q] = !polarities[q];
    updatePolarityUI(q);
    refreshCircuit(q);
  }

  function updatePolarityUI(q) {
    const isNormal = polarities[q];
    if (q === 6) {
      document.getElementById('pol-6-left').textContent = isNormal ? '＋' : '－';
    } else {
      document.getElementById(`pol-${q}-left`).textContent = isNormal ? '＋' : '－';
      document.getElementById(`pol-${q}-right`).textContent = isNormal ? '－' : '＋';
    }
  }

  function handleVolt(q) {
    const v = parseFloat(document.getElementById(`range-${q}`).value);
    document.getElementById(`val-${q}`).textContent = v.toFixed(1) + 'V';
    refreshCircuit(q);
  }

  function setLight(id, glowClass, isOn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('glow-red', 'glow-blue', 'glow-yellow', 'glow-green', 'led-off');
    if (isOn) {
      el.classList.add(glowClass);
    } else {
      el.classList.add('led-off');
    }
  }

  function refreshCircuit(q) {
    const v = parseFloat(document.getElementById(`range-${q}`).value);
    const p = polarities[q];

    switch(q) {
      case 1: { // 第 1 題：並聯紅藍 LED
        const redOn = p && (v >= 2.0);
        const blueOn = false; // 紅燈箝位電壓
        setLight('led-1-red', 'glow-red', redOn);
        setLight('led-1-blue', 'glow-blue', blueOn);
        const note = document.getElementById('note-1');
        if (!p) note.textContent = '極性反接：兩燈截止不亮';
        else if (v < 2.0) note.textContent = '電壓不足 (未達紅燈 2.0V 門檻)';
        else note.textContent = '僅紅燈亮（紅燈箝位使藍燈不亮）';
        break;
      }

      case 2: { // 第 2 題：串聯紅藍 LED
        const bothOn = p && (v >= 5.0); // 2.0 + 3.0 = 5.0V
        setLight('led-2-red', 'glow-red', bothOn);
        setLight('led-2-blue', 'glow-blue', bothOn);
        const note = document.getElementById('note-2');
        if (!p) note.textContent = '極性反接：串聯截止均不亮';
        else if (v < 5.0) note.textContent = `電壓不足 (${v.toFixed(1)}V < 5.0V 門檻)`;
        else note.textContent = '藍、紅皆亮（若電壓夠高）';
        break;
      }

      case 3: { // 第 3 題：並聯黃綠 LED
        const yOn = p && (v >= 2.1);
        const gOn = p && (v >= 2.2);
        setLight('led-3-yellow', 'glow-yellow', yOn);
        setLight('led-3-green', 'glow-green', gOn);
        const note = document.getElementById('note-3');
        if (!p) note.textContent = '極性反接：兩燈均不亮';
        else if (v < 2.1) note.textContent = '電壓不足：未達導通門檻';
        else note.textContent = '跨到電壓（黃綠皆亮）';
        break;
      }

      case 4: { // 第 4 題：串聯黃綠 LED
        const bothOn = p && (v >= 4.3); // 2.1 + 2.2 = 4.3V
        setLight('led-4-yellow', 'glow-yellow', bothOn);
        setLight('led-4-green', 'glow-green', bothOn);
        const note = document.getElementById('note-4');
        if (!p) note.textContent = '極性反接：串聯截止全滅';
        else if (v < 4.3) note.textContent = `電壓不足 (${v.toFixed(1)}V < 4.3V 門檻)`;
        else note.textContent = '當電壓足夠時（黃綠兩燈皆亮）';
        break;
      }

      case 5: { // 第 5 題：反向並聯 LED
        const aOn = (!p) && (v >= 2.0); // 右+ 左-
        const bOn = p && (v >= 2.0);    // 左+ 右-
        setLight('led-5-a', 'glow-red', aOn);
        setLight('led-5-b', 'glow-green', bOn);
        const note = document.getElementById('note-5');
        if (v < 2.0) note.textContent = '電壓過低：兩燈均未達門檻';
        else if (aOn) note.textContent = 'A 燈亮、B 燈熄滅（極性輪流導通）';
        else note.textContent = 'B 燈亮、A 燈熄滅（極性輪流導通）';
        break;
      }

      case 6: { // 第 6 題：橋式整流
        const on = (v >= 3.2);
        setLight('led-6-load', 'glow-green', on);
        const note = document.getElementById('note-6');
        if (v < 3.2) {
          note.textContent = `電壓不足 (${v.toFixed(1)}V < 3.2V 門檻)`;
        } else {
          note.textContent = '無論改變極性，負載燈均恆亮！';
        }
        break;
      }
    }
  }

  // 初始化執行
  for (let i = 1; i <= 6; i++) {
    updatePolarityUI(i);
    refreshCircuit(i);
  }
</script>

</body>
</html>
